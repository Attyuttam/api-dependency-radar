server.port=${PORT:8080}

spring.application.name=api-dependency-radar
spring.profiles.default=local

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_dependency_radar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.flyway.enabled=true
# Baseline the existing local schema at version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema

app.security.username=${APP_USERNAME:radar}
app.security.password=${APP_PASSWORD:radar}
