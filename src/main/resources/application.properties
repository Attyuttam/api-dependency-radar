server.port=${PORT:8080}

spring.application.name=api-dependency-radar
spring.profiles.default=local

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_dependency_radar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.flyway.enabled=true
# Baseline the existing local schema at version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}


# Check for dependencies due for monitoring every 60 seconds.
app.monitoring.poll-interval-ms=60000

# OpenAPI specification fetching limits
# Defaults: 20 MiB maximum response, 30-second overall deadline
app.openapi.max-response-size-bytes=${OPENAPI_MAX_RESPONSE_SIZE_BYTES:41943040}
app.openapi.max-fetch-duration=${OPENAPI_MAX_FETCH_DURATION:30s}
